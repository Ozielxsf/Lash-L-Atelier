<!doctype html>
<!--
  Lash L'Atelier app icon — the source artwork for every home-screen icon and
  favicon. Rendered by scripts/app-icon/render.mjs (Chromium, so the brand's
  real fonts are used). Drawn on a 1024 canvas; everything important sits
  inside the central 80% so Android's "maskable" crops never cut it.
  ?safe=1 shrinks the artwork for the maskable variant; ?fav=1 is the
  browser-tab favicon — a bigger L and one bolder ring, no fine detail that
  would turn to mush at 16–32px. ?admin=1 is the studio dashboard's icon:
  the same monogram inverted onto blush paper and lettered ADMIN, so the
  owner never mixes it up with the public site's icon.
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "GV"; src: url(great-vibes-latin.woff2) format("woff2"); }
@font-face { font-family: "CZ"; src: url(cinzel-latin.woff2) format("woff2"); font-weight: 400 900; }
html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #0d080b; }
svg { display: block; }
</style></head><body>
<svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Night: plum at the heart, near-black at the edge -->
    <radialGradient id="night" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#3a1f2e"/>
      <stop offset="0.45" stop-color="#1e1219"/>
      <stop offset="1" stop-color="#0b0609"/>
    </radialGradient>
    <!-- Rose gold: champagne highlight → gaslight gold → brand rose → deep rose -->
    <linearGradient id="rosegold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbe6c4"/>
      <stop offset="0.3" stop-color="#e6bd78"/>
      <stop offset="0.62" stop-color="#f2a7c6"/>
      <stop offset="1" stop-color="#b8688a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2a7c6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a7c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect id="bg" width="1024" height="1024" fill="url(#night)"/>

  <g id="mark">
    <circle cx="512" cy="512" r="300" fill="url(#glow)"/>

    <!-- The seal's double ring -->
    <circle id="outer" cx="512" cy="512" r="392" fill="none" stroke="url(#rosegold)" stroke-width="7"/>
    <circle class="detail" cx="512" cy="512" r="366" fill="none" stroke="url(#rosegold)" stroke-width="2.2" opacity="0.85"/>

    <!-- Fleurons on the ring: diamonds top & bottom, pearls left & right -->
    <g class="detail" fill="url(#rosegold)">
      <path d="M512 104 l15 16 -15 16 -15 -16z"/>
      <path d="M512 888 l15 16 -15 16 -15 -16z"/>
      <circle cx="120" cy="512" r="8"/>
      <circle cx="904" cy="512" r="8"/>
    </g>

    <!-- The monogram: the script L of "Lash" -->
    <!-- Fitted in script below by its measured outline, not its font box:
         Great Vibes' L has a long tail that a font-size guess lets escape. -->
    <g filter="url(#soft)">
      <g id="mono">
        <text font-family="GV" font-size="400" fill="url(#rosegold)">L</text>
        <text font-family="GV" font-size="400" fill="url(#sheen)">L</text>
      </g>
    </g>

    <!-- L'ATELIER, small, on a hairline — the seal's lower lettering -->
    <text id="label" class="detail" x="519" y="812" text-anchor="middle" font-family="CZ" font-weight="600" font-size="50" letter-spacing="14" fill="url(#rosegold)">L’ATELIER</text>

    <!-- A single sparkle, the brand's star -->
    <path id="spark" fill="#fbe6c4" d="M0 -46 C4 -10 10 -4 46 0 C10 4 4 10 0 46 C-4 10 -10 4 -46 0 C-10 -4 -4 -10 0 -46Z"/>
  </g>
</svg>
<script>
  // Fit the monogram into a 500×500 box centred a little above the middle,
  // then perch the sparkle on its top-right curl.
  const params = new URLSearchParams(location.search);
  const fav = params.get("fav") === "1";
  if (params.get("admin") === "1") {
    // Blush paper, rouge-and-antique-gold ink.
    const stops = (id, colours) =>
      document.querySelectorAll(`#${id} stop`).forEach((s, i) => s.setAttribute("stop-color", colours[i]));
    stops("night", ["#fdf5f8", "#f7e6ec", "#e9c9d6"]);
    stops("rosegold", ["#c9a063", "#a8264f", "#861c3e", "#5a1e38"]);
    stops("glow", ["#a8264f", "#a8264f"]);
    document.querySelector("#glow stop").setAttribute("stop-opacity", "0.10");
    document.querySelector("#sheen stop").setAttribute("stop-opacity", "0.25");
    document.querySelector("#soft feDropShadow").setAttribute("flood-opacity", "0.18");
    document.getElementById("spark").setAttribute("fill", "#c9a063");
    document.getElementById("label").textContent = "ADMIN";
  }
  if (fav) {
    document.querySelectorAll(".detail").forEach((el) => el.remove());
    const o = document.getElementById("outer");
    o.setAttribute("stroke-width", "26");
    o.setAttribute("r", "420");
  }
  document.fonts.ready.then(() => {
    const mono = document.getElementById("mono");
    const b = mono.getBBox();
    const box = fav ? 620 : 500;
    const k = Math.min(box / b.width, box / b.height);
    const cx = 512, cy = fav ? 512 : 470;
    mono.setAttribute("transform", `translate(${cx - (b.x + b.width / 2) * k} ${cy - (b.y + b.height / 2) * k}) scale(${k})`);
    const right = cx + (b.width * k) / 2, top = cy - (b.height * k) / 2;
    document.getElementById("spark").setAttribute("transform", `translate(${right - 18} ${top + 40})${fav ? " scale(1.5)" : ""}`);
    document.body.dataset.ready = "1";
  });
  if (params.get("safe") === "1") {
    document.getElementById("mark").setAttribute("transform", "translate(512 512) scale(0.82) translate(-512 -512)");
  }
</script>
</body></html>
